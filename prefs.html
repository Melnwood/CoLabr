<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How you hear from us — Co-Labr</title>
<style>
  :root{--acc:#FF6600;--bg:#f4f1ec;--card:#fff;--line:#e7e4e0;--muted:#7a756f;--text:#241f1b;--green:#2f9e63;--red:#c0392b;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:grid;place-items:center;padding:24px}
  .card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 22px;box-shadow:0 20px 50px rgba(60,40,20,.08)}
  .logo{height:22px;width:auto;display:block;margin-bottom:16px}
  h1{font-size:21px;font-weight:770;margin:0 0 6px}
  p.lede{font-size:13.5px;color:var(--muted);margin:0 0 16px;line-height:1.5}
  .prefopts{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
  .prefopts label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer}
  .prefopts label:has(input:checked){border-color:var(--acc);background:#fff8f1}
  .prefopts input{margin-top:2px;accent-color:var(--acc)}
  .prefopts .po b{font-size:13.5px;display:block}.prefopts .po i{font-style:normal;font-size:11.5px;color:var(--muted)}
  .save{width:100%;background:var(--acc);color:#fff;border:none;font-weight:700;font-size:15px;padding:13px;border-radius:10px;cursor:pointer}
  .unsub{display:block;text-align:center;margin-top:14px;font-size:12.5px;color:var(--muted);cursor:pointer;background:none;border:none;width:100%}
  .msg{font-size:12.5px;margin-top:10px;min-height:15px}.msg.ok{color:var(--green)}.msg.err{color:var(--red)}
  .state{color:var(--muted);font-size:14px}
  .offramp{margin-top:14px;background:#fff8f1;border:1px solid #f0dcc4;border-radius:12px;padding:14px 15px}
  .offramp b{font-size:14px}
  .offramp p{font-size:12.5px;color:var(--muted);margin:5px 0 10px;line-height:1.5}
  .orbtns{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
  .orbtns button{text-align:left;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;font-family:inherit}
  .orbtns button:hover{border-color:var(--acc);color:var(--acc)}
  .orgo{background:none;border:none;font-size:12px;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
</style>
</head>

}
async function load(){
  const card=document.getElementById('card');
  if(!T){ card.innerHTML='<div class="state">This preferences link is missing its code.</div>'; return; }
  try{
    const d=await api('get');
    const who=esc(d.missionary||'family');
    card.innerHTML=`<img class="logo" src="${LOGO}" alt="Josiah Venture">
      <h1>${WELCOME&&!d.active?`Welcome — how would you like to follow ${who}?`:`How you hear from ${who}`}</h1>
      <p class="lede">Hi ${esc(d.name||'friend')} — ${WELCOME&&!d.active?'pick whatever fits your life. You can change it or stop anytime.':'choose what works for you. Changes save when you click below.'}</p>
      <div class="prefopts" id="opts">${OPTS.map(o=>`<label><input type="radio" name="pref" value="${o[0]}" ${d.preference===o[0]?'checked':''}><div class="po"><b>${esc(o[1])}</b><i>${esc(o[2])}</i></div></label>`).join('')}</div>
      <button class="save" id="save">${WELCOME&&!d.active?'Count me in':'Save my preference'}</button>
      <button class="unsub" id="unsub">${WELCOME&&!d.active?'No thanks — I\u2019d rather not get updates':'Unsubscribe from all updates'}</button>
      <div class="offramp" id="offramp" style="display:none">
        <b>Before you go — would a lighter touch work better?</b>
        <p>Maybe it\u2019s just too frequent. These are the quietest ways to stay connected:</p>
        <div class="orbtns">
          <button data-or="Monthly digest">One summary a month</button>
          <button data-or="Link email">Just a short heads-up with a link</button>
          <button data-or="Site only">No emails \u2014 I\u2019ll visit the site</button>
        </div>
        <button class="orgo" id="orgo">No, continue to unsubscribe</button>
      </div>
      <button class="unsub" id="erase" style="margin-top:6px">Delete my details completely</button>
      <div class="msg" id="msg"></div>
      <a href="privacy.html" style="display:block;text-align:center;margin-top:12px;font-size:11.5px;color:var(--muted)">How we care for your details</a>`;
    document.getElementById('save').addEventListener('click',save);
    document.getElementById('unsub').addEventListener('click',unsub);
    document.getElementById('erase').addEventListener('click',erase);
    if(!d.active){ const m=document.getElementById('msg'); m.className='msg'; m.textContent='You are currently unsubscribed — pick an option above to start again.'; }
  }catch(e){ card.innerHTML='<div class="state">'+esc(e.message)+'</div>'; }
}
async function save(){
  const pref=(document.querySelector('input[name=pref]:checked')||{}).value;
  const m=document.getElementById('msg'); m.className='msg'; m.textContent='Saving…';
  try{ await api('update',{preference:pref}); m.className='msg ok'; m.textContent='Saved. Thanks for following along!'; }
  catch(e){ m.className='msg err'; m.textContent=e.message; }
}
function unsub(){
  // Soft off-ramp first: offer the quieter ways before actually unsubscribing.
  const o=document.getElementById('offramp');
  if(o.style.display==='none'){
    o.style.display='block';
    document.getElementById('unsub').style.display='none';
    o.querySelectorAll('[data-or]').forEach(b=>b.addEventListener('click',async()=>{
      const m=document.getElementById('msg'); m.className='msg'; m.textContent='Saving…';
      try{ await api('update',{preference:b.dataset.or}); m.className='msg ok'; m.textContent='Perfect — switched to \u201c'+b.textContent+'\u201d. Thanks for staying connected.'; o.style.display='none'; }
      catch(e){ m.className='msg err'; m.textContent=e.message; }
    }));
    document.getElementById('orgo').addEventListener('click',doUnsub);
    return;
  }
}
async function erase(){
  if(!confirm('Delete your details completely? This removes your name, email, and any messages you\u2019ve sent \u2014 permanently. There is no undo.'))return;
  const m=document.getElementById('msg'); m.className='msg'; m.textContent='Deleting\u2026';
  try{
    await api('erase');
    document.getElementById('card').innerHTML='<div class="state">Your details have been deleted. Thank you for the time you walked with us.</div>';
  }catch(e){ m.className='msg err'; m.textContent=e.message; }
}
async function doUnsub(){
  const m=document.getElementById('msg'); m.className='msg'; m.textContent='Updating…';
  try{ await api('unsubscribe'); m.className='msg ok'; m.textContent='Done — you won\u2019t get emails. You can come back anytime with this same link.'; document.getElementById('offramp').style.display='none'; }
  catch(e){ m.className='msg err'; m.textContent=e.message; }
}
load();
</script>
<script src="help.js"></script>
</body>
</html>
