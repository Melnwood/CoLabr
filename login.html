<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoLabr — Sign in</title>
<style>
  :root{--acc:#FF6600;--bg:#0d0d0d;--card:#161616;--line:#2a2a2a;--muted:#8b9096;--text:#f2f3f4;--red:#e0524e;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:grid;place-items:center;padding:20px}
  .box{width:100%;max-width:400px;text-align:center}
  .lg{width:52px;height:52px;border-radius:14px;background:var(--acc);display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;margin:0 auto 20px}
  h1{font-size:24px;font-weight:750;letter-spacing:-.02em;margin:0 0 8px}
  p{font-size:14px;color:var(--muted);line-height:1.55;margin:0 0 26px}
  .gbtn{display:inline-flex;align-items:center;gap:11px;background:#fff;color:#1f1f1f;font-weight:600;font-size:15px;padding:13px 22px;border-radius:11px;text-decoration:none;border:1px solid #dadce0}
  .gbtn svg{width:19px;height:19px}
  .err{background:#2a1513;color:#f0a19d;border:1px solid #4a201d;border-radius:11px;padding:12px 15px;font-size:13px;line-height:1.5;margin-bottom:22px;display:none;text-align:left}
  .note{font-size:11.5px;color:#6a6f75;margin-top:22px;line-height:1.5}
</style>
</head>
<body>
  <div class="box">
    <div class="lg">JV</div>
    <h1>CoLabr</h1>
    <p>Sign in with your Josiah Venture Google account to write and manage updates.</p>
    <div class="err" id="err"></div>
    <a class="gbtn" href="/.netlify/functions/auth-start">
      <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.4 5.4 2.5 13.2l7.9 6.2C12.2 13.6 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.5 3-2.2 5.5-4.7 7.2l7.3 5.7c4.3-3.9 6.8-9.7 6.8-17.4z"/><path fill="#FBBC05" d="M10.4 28.4c-.5-1.4-.8-2.9-.8-4.4s.3-3 .8-4.4l-7.9-6.2C.9 16.5 0 20.1 0 24s.9 7.5 2.5 10.6l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.3-5.7c-2 1.4-4.7 2.3-8.6 2.3-6.4 0-11.8-4.1-13.6-9.9l-7.9 6.2C6.4 42.6 14.6 48 24 48z"/></svg>
      Sign in with Google
    </a>
    <div class="note">Access is limited to @josiahventure.com accounts.</div>
  </div>
<script>
  const e=new URLSearchParams(location.search).get('e');
  if(e){const el=document.getElementById('err');el.style.display='block';el.textContent=e;}
</script>
</body>
</html>
