<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoLabr — Send to</title>
<style>
  :root{--acc:#FF6600;--bg:#0e0e0e;--card:#181818;--line:#2b2b2b;--muted:#9aa0a8;--text:#f4f4f5;--blue:#5b8def;--g:#4285F4;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:12px}
  svg{display:block}
  .phone{width:390px;max-width:100%;height:800px;max-height:94vh;background:var(--bg);border-radius:34px;overflow:hidden;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 9px #0a0a0a,0 0 0 11px #262626;display:flex;flex-direction:column;color:var(--text)}
  .sb{height:40px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 22px 6px;font-size:12px;font-weight:700}
  .top{flex:none;padding:12px 16px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
  .top .bk{width:30px;height:30px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;color:var(--muted)}
  .top .bk svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
  .top h1{margin:0;font-size:16px;font-weight:750}
  .top .s{font-size:11.5px;color:var(--muted);margin-top:1px;display:flex;align-items:center;gap:5px}
  .top .s svg{width:12px;height:12px}

  .scr{flex:1;overflow-y:auto;padding:14px 14px 12px}
  .scr::-webkit-scrollbar{width:0}
  .lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 4px 10px}

  .grp{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:9px;cursor:pointer;transition:.12s}
  .grp.on{border-color:var(--acc);background:#1a1510}
  .grp .ck{width:22px;height:22px;border-radius:7px;border:1.5px solid #444;display:grid;place-items:center;flex:none;color:#fff}
  .grp.on .ck{background:var(--acc);border-color:var(--acc)}
  .grp .ck svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.6;display:none}
  .grp.on .ck svg{display:block}
  .grp .ic{width:34px;height:34px;border-radius:9px;background:#232323;border:1px solid var(--line);display:grid;place-items:center;flex:none}
  .grp .ic svg{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .grp.on .ic svg{stroke:var(--acc)}
  .grp .tt{flex:1;min-width:0}
  .grp .tt b{font-size:14px;font-weight:650;display:block}
  .grp .tt span{font-size:11.5px;color:var(--muted)}
  .grp .cnt{font-size:13px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;flex:none}
  .real{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--acc);background:#241a10;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:1px}

  .foot{flex:none;border-top:1px solid var(--line);padding:13px 16px 20px;background:#111}
  .foot .reach{font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:10px}
  .foot .reach b{color:var(--text)}
  .send{width:100%;background:var(--acc);color:#fff;font-weight:700;font-size:15px;padding:14px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:9px}
  .send svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2}
</style>
</head>
<body>
<div class="phone">
  <div class="sb"><span>9:41</span><span>● ● ●&nbsp; 5G</span></div>
  <div class="top">
    <div class="bk"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div>
    <div>
      <h1>Send this update</h1>
      <div class="s"><svg viewBox="0 0 24 24" fill="none" stroke="#7ea8f5" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg> Pulled live from your Google Contacts</div>
    </div>
  </div>

  <div class="scr" id="scr">
    <div class="lbl">Choose who gets it</div>
    <div id="list"></div>
  </div>

  <div class="foot">
    <div class="reach" id="reach"></div>
    <button class="send"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-6-7-2z"/></svg> <span id="sendtxt">Send through Gmail</span></button>
  </div>
</div>

<script>
const GROUPS=[
  {n:'Monthly partners',c:84,tag:'International',real:false,on:true},
  {n:'Prayer team',c:126,tag:'International',real:false,on:true},
  {n:'Currey Creek Church',c:40,tag:'International',real:true,on:true},
  {n:'Family & friends',c:58,tag:'International',real:false,on:false},
  {n:'Czech friends & church',c:27,tag:'In-country',real:false,on:false},
  {n:'Full newsletter list',c:231,tag:'International',real:false,on:false}
];
const peopleIcon='<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5 6-5s6 1.7 6 5"/><path d="M16 5.5a3 3 0 0 1 0 5.6M18 20c0-2.5-1-4-3-4.6"/></svg>';
const check='<svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 6"/></svg>';
const list=document.getElementById('list');
function render(){
  list.innerHTML=GROUPS.map((g,i)=>`
    <div class="grp ${g.on?'on':''}" data-i="${i}">
      <div class="ck">${check}</div>
      <div class="ic">${peopleIcon}</div>
      <div class="tt"><b>${g.n}${g.real?'<span class="real">Your real group</span>':''}</b><span>${g.tag} audience</span></div>
      <div class="cnt">${g.c}</div>
    </div>`).join('');
  list.querySelectorAll('.grp').forEach(el=>el.addEventListener('click',()=>{GROUPS[el.dataset.i].on=!GROUPS[el.dataset.i].on;render();}));
  const sel=GROUPS.filter(g=>g.on); const people=sel.reduce((s,g)=>s+g.c,0);
  document.getElementById('reach').innerHTML=`Sending to <b>${people} people</b> across <b>${sel.length} ${sel.length===1?'group':'groups'}</b>`;
  document.getElementById('sendtxt').textContent=people?`Send to ${people} through Gmail`:'Pick a group';
}
render();
</script>
</body>
</html>
