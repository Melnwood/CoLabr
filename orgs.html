<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0D1B2A">
<meta name="application-name" content="Co·labr">
<meta name="apple-mobile-web-app-title" content="Co·labr"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Co·labr: Organizations forming</title>
<style>
  :root{--acc:#FF6600;--bg:#f4f1ec;--card:#fff;--line:#e7e4e0;--muted:#7a756f;--text:#241f1b;--green:#2f9e63}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:26px 20px 80px}
  .back{font-size:13px;color:var(--muted);text-decoration:none}
  h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:14px 0 6px}
  .lede{font-size:13.5px;color:var(--muted);line-height:1.55;margin:0 0 22px}
  .org{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
  .org.hot{border-color:var(--acc);box-shadow:0 6px 18px rgba(255,102,0,.10)}
  .oh{display:flex;align-items:center;gap:10px}
  .oh b{font-size:15.5px}
  .cnt{margin-left:auto;font-size:13px;font-weight:800;color:var(--muted)}
  .hot .cnt{color:var(--acc)}
  .badge{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--acc);border-radius:12px;padding:3px 9px}
  .how{font-size:11.5px;color:var(--muted)}
  .mem{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:12.5px;color:#4a443f;line-height:1.7}
  .mem .lv{color:var(--green);font-weight:700}
  .mem .tst{color:var(--muted)}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:40px 0}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/admin.html">← Super admin</a>
  <h1>Organizations forming</h1>
  <p class="lede">Individual missionaries clustered by the organization they serve with. When one crosses <b>3</b>, it lights up — that's your cue for a human conversation about an organization account. Nothing here ever emails anyone.</p>
  <div id="list"><div class="empty">Loading…</div></div>
</div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('/.netlify/functions/org-watch').then(r=>{ if(r.status===401){location.href='/login.html';return null;} return r.json(); }).then(d=>{
  if(!d) return;
  const list=document.getElementById('list');
  if(d.error){ list.innerHTML='<div class="empty">'+esc(d.error)+'</div>'; return; }
  const orgs=(d.orgs||[]).filter(o=>o.label!=='Josiah Venture');
  const jv=(d.orgs||[]).find(o=>o.label==='Josiah Venture');
  if(!orgs.length){ list.innerHTML='<div class="empty">No outside organizations yet — as individual missionaries join, they\'ll cluster here.</div>'+(jv?jvRow(jv):''); return; }
  list.innerHTML=orgs.map(o=>`
    <div class="org${o.flag?' hot':''}">
      <div class="oh"><b>${esc(o.label)}</b>${o.flag?'<span class="badge">Reach out</span>':''}<span class="cnt">${o.count} missionar${o.count===1?'y':'ies'}</span></div>
      <div class="how">grouped by ${esc(o.how)}</div>
      <div class="mem">${o.members.map(m=>`${esc(m.name||m.email)} <span class="${m.live?'lv':'tst'}">${m.live?'· live':'· test mode'}</span>`).join('<br>')}</div>
    </div>`).join('')+(jv?jvRow(jv):'');
});
function jvRow(jv){ return `<div class="org"><div class="oh"><b>Josiah Venture</b><span class="cnt">${jv.count} (home organization)</span></div></div>`; }
</script>
<script src="help.js"></script>
</body>
</html>
