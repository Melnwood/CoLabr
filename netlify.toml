[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Automated off-Airtable backup: snapshot every table to the GCS bucket every 3 hours.
[functions."backup"]
  schedule = "0 */3 * * *"

# Care radar morning digest: daily at 05:00 UTC = 7:00 in Czechia (summer).
[functions."care-digest"]
  schedule = "0 5 * * *"

# Monthly prayer update: 1st of each month, 06:00 UTC. Gathers the month's prayer
# requests + anything answered into a DRAFT update and tells the missionary.
[functions."prayer-monthly"]
  schedule = "0 6 1 * *"

# The trial clock: warn, freeze, hide, and (only after two months dark, with the
# archive already delivered) delete. Inert until "Billing enforcement" is ticked
# in Platform Settings — see netlify/functions/_billing.js.
[functions."billing-sweep"]
  schedule = "0 7 * * *"
