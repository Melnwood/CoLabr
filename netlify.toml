[build]
  publish = "."
  functions = "netlify/functions"

# ---- staging -------------------------------------------------------------------
# Push to a branch called "staging" and Netlify builds it at its own URL, so a change
# can be seen working before it reaches anybody's supporters. Until now every push
# landed on the live site, which was survivable only because email is paused and no
# page is public.
#
# TWO THINGS MUST BE SET IN THE NETLIFY UI, or staging writes to live data:
#   1. Site configuration, Build and deploy, Branches: add "staging".
#   2. Environment variables: for the staging context ONLY, override AIRTABLE_BASE
#      with a duplicate of the base. Duplicating is a two-click job in Airtable.
# Without step 2 this is not staging, it is a second door onto production.
[context.staging.environment]
  CL_ENV = "staging"

[functions]
  node_bundler = "esbuild"

# Automated off-Airtable backup: snapshot every table to the GCS bucket every 3 hours.
[functions."backup"]
  schedule = "0 */3 * * *"

# Care radar morning digest: daily at 05:00 UTC = 7:00 in Czechia (summer).
[functions."care-digest"]
  schedule = "0 5 * * *"

# Monthly prayer update: 1st of each month, 06:00 UTC. Gathers the month's prayer
# requests + anything answered into a DRAFT update and tells the missionary.
[functions."prayer-monthly"]
  schedule = "0 6 1 * *"

# The trial clock: warn, freeze, hide, and (only after two months dark, with the
# archive already delivered) delete. Inert until "Billing enforcement" is ticked
# in Platform Settings — see netlify/functions/_billing.js.
[functions."billing-sweep"]
  schedule = "0 7 * * *"

# Yesterday's faults, once a day at 06:30 UTC, and nothing at all on a clean day.
# Recording errors is useless if nobody reads the table they land in.
[functions."error-digest"]
  schedule = "30 6 * * *"

# Netlify has no built-in type for .webmanifest and falls back to octet-stream,
# which Chrome logs as an error and some browsers refuse outright.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Security headers for every page. Referrer-Policy is the one that matters most
# here: a wall URL can carry a supporter's access key, and without this it would
# travel to every outbound link in the Referer header. The key is also stripped
# from the address bar in index.html; this is the belt to that pair of braces.
# Content-Security-Policy is deliberately NOT set yet: every page carries inline
# scripts, so a real policy needs nonces rather than a one-line guess.
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # ENFORCED: four directives that cannot break a working page and close real holes.
    # base-uri stops an injected <base> silently repointing every relative URL on the
    # page. object-src kills plugin embeds. frame-ancestors is clickjacking cover that
    # actually applies in modern browsers, where X-Frame-Options above is the fallback.
    # form-action stops an injected form posting somewhere else.
    Content-Security-Policy = "base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'"
    # REPORT-ONLY: the real resource policy, watched before it is enforced. Two things
    # make guessing it dangerous. Every page is built from inline scripts, so script-src
    # still needs unsafe-inline until those move to nonces, which is why XSS escaping
    # remains a separate job rather than something this header solves. And imported
    # Mailchimp history embeds images from hosts nobody has a list of, so img-src stays
    # broad on purpose rather than breaking fourteen years of somebody's updates.
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://storage.googleapis.com; connect-src 'self' https://storage.googleapis.com https://nominatim.openstreetmap.org; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; report-uri /.netlify/functions/csp-report"
