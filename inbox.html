<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Co·labr — Responses</title>
<style>
  :root{--acc:#FF6600;--bg:#f4f1ec;--card:#ffffff;--card2:#f4f1ec;--line:#e7e4e0;--muted:#7a756f;--text:#241f1b;--green:#2f9e63;--red:#c0392b;--blue:#2f6df0;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  img{display:block}
  .wrap{max-width:760px;margin:0 auto;padding:0 18px 90px}
  .top{display:flex;align-items:center;gap:12px;padding:18px 2px 14px;border-bottom:1px solid var(--line);margin-bottom:18px}
  .brand .jvlogo{height:20px;width:auto;display:block;margin-bottom:5px}
  .brand .pg{font-size:11px;color:var(--muted);display:block}
  .nav{margin-left:auto;display:flex;gap:8px;align-items:center}
  .nav a{font-size:12.5px;color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:7px 12px;border-radius:8px}
  h1{font-size:23px;font-weight:750;letter-spacing:-.02em;margin:6px 0 14px}
  .tabs{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;margin-bottom:16px}
  .tabs button{border:none;background:none;font-size:13px;font-weight:700;padding:9px 16px;color:var(--muted);cursor:pointer}
  .tabs button.on{background:var(--acc);color:#fff}
  .ritem{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--card)}
  .ritem.unread{border-color:#f3d3b6;background:#fff8f1}
  .rtype{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:4px 8px;border-radius:11px;flex:none}
  .rtype.Prayer{background:#eef3fe;color:var(--blue)}.rtype.Note{background:#fdf2e0;color:#a9701a}.rtype.Encouragement{background:#eafaf1;color:#1f7a48}
  .rtx{flex:1;min-width:0}.rtx b{font-size:14px}.rtx .rm{font-size:13.5px;color:#463a28;margin-top:2px;line-height:1.5}
  .rtx .rmeta{font-size:11.5px;color:var(--muted);margin-top:5px}
  .sent{margin-top:10px;background:#faf7f2;border-left:3px solid var(--acc);border-radius:8px;padding:9px 12px;font-size:13px;color:#3c3733;line-height:1.5}
  .sent b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--acc);margin-bottom:3px}
  .ract{display:flex;flex-direction:column;gap:6px;flex:none}
  .ract button{font-size:11.5px;font-weight:650;padding:6px 10px;border-radius:7px;border:1px solid var(--line);background:var(--card2);cursor:pointer;color:var(--text)}
  .ract .reply{color:var(--acc);border-color:#f3d3b6}
  .rcompose{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:none}
  .rcompose.open{display:block}
  .rcompose textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;font-family:inherit;min-height:74px;resize:vertical;outline:none}
  .rcompose .send{background:var(--acc);color:#fff;font-weight:700;font-size:12.5px;padding:8px 16px;border:none;border-radius:8px;cursor:pointer;margin-top:6px}
  .rcompose .cmsg{font-size:12px;margin-left:10px}.rcompose .cmsg.err{color:var(--red)}.rcompose .cmsg.ok{color:var(--green)}
  .state{color:var(--muted);padding:34px 4px;font-size:14px}

  /* Uniform dashboard-zone nav buttons (shared across all backend pages) */
  .nav{flex-wrap:wrap}
  .nav a{flex:0 0 auto;font-size:12.5px;font-weight:600;color:#241f1b;background:#fff;border:1px solid #e7e0d6;padding:8px 14px;border-radius:22px;white-space:nowrap;line-height:1;text-decoration:none;display:inline-flex;align-items:center;box-shadow:0 1px 2px rgba(60,40,20,.05);transition:transform .12s,box-shadow .12s,border-color .12s,background .12s;cursor:pointer}
  .nav a:hover{box-shadow:0 6px 15px rgba(60,40,20,.14);transform:translateY(-1px);border-color:#d8cdb6}
  .nav a:active{transform:translateY(0);box-shadow:0 1px 2px rgba(60,40,20,.08);background:#f6f2ec}
  .nav a:focus-visible{outline:2px solid #241f1b;outline-offset:2px}
  .nav a.acc{background:#241f1b;color:#fff;border-color:#241f1b;box-shadow:0 2px 8px rgba(36,31,27,.22)}
  .nav a.acc:hover{background:#000;box-shadow:0 8px 18px rgba(36,31,27,.28)}
  .nav a.acc:active{background:#241f1b}
</style>
</head>

  </div>
<script>
let RESP=[], filter='new';
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function guard(){ try{ const r=await fetch('/.netlify/functions/me'); if(!r.ok) throw 0; return true; }catch{ location.replace('login.html'); return false; } }
async function api(action,extra){
  const r=await fetch('/.netlify/functions/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...extra})});
  if(r.status===401){location.replace('login.html');throw new Error('Please sign in.');}
  const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||'Error'); return d;
}
async function load(){ try{ RESP=(await api('responses')).rows||[]; render(); }catch(e){ document.getElementById('list').innerHTML='<div class="state">'+esc(e.message)+'</div>'; } }
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{ filter=b.dataset.f; document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b)); render(); }));
function render(){
  const list=document.getElementById('list');
  let rows=RESP;
  if(filter==='new') rows=RESP.filter(r=>!r.read);
  else if(filter==='replied') rows=RESP.filter(r=>r.replied);
  if(!rows.length){ list.innerHTML='<div class="state">'+(filter==='new'?'Nothing new — you\'re all caught up.':(filter==='replied'?'No replies sent yet.':'No responses yet.'))+'</div>'; return; }
  list.innerHTML=rows.map(r=>{
    let when=''; try{ when=r.created?new Date(r.created).toLocaleString(undefined,{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}):''; }catch(e){}
    const canReply=!!r.email;
    const msg=(r.type==='Prayer'&&!r.message)?`<i>${/&|\band\b|\+|,/i.test(r.name)?'are':'is'} praying for you</i>`:esc(r.message);
    // The whole back-and-forth, in order — every reply on both sides is kept.
    const th=(r.thread&&r.thread.length)?r.thread:((r.replied&&r.reply)?[{f:'m',t:r.reply}]:[]);
    const sent=th.length?`<div class="sent">${th.map(x=>`<b>${x.f==='m'?'You replied':esc(r.name)+' wrote back'}</b>${esc(x.t)}`).join('<hr style="border:none;border-top:1px solid #eee7dc;margin:8px 0">')}</div>`:'';
    const composer=canReply?`<div class="rcompose" id="comp-${r.id}"><textarea id="txt-${r.id}" placeholder="Write ${esc(r.name)} back…"></textarea><button class="send" data-id="${r.id}">Send reply</button><span class="cmsg" id="cmsg-${r.id}"></span></div>`:'';
    const replyBtn=canReply?`<button class="reply replybtn" data-id="${r.id}">${r.replied?'Reply again':'Reply'}</button>`:'';
    const markBtn=r.read?`<button class="markbtn" data-id="${r.id}" data-read="false">Mark unread</button>`:`<button class="markbtn" data-id="${r.id}" data-read="true">Mark done</button>`;
    return `<div class="ritem ${r.read?'':'unread'}"><span class="rtype ${r.type}">${r.type}</span>
      <div class="rtx"><b>${esc(r.name)}</b><div class="rm">${msg}</div>
        <div class="rmeta">${r.updateTitle?esc(r.updateTitle)+' · ':''}${when}${r.isPublic?' · public':''}${r.email?(' · '+esc(r.email)):' · no email'}</div>
        ${sent}${composer}</div>
      <div class="ract">${replyBtn}${markBtn}</div></div>`;
  }).join('');
  list.querySelectorAll('.replybtn').forEach(b=>b.addEventListener('click',()=>{ const c=document.getElementById('comp-'+b.dataset.id); if(c){c.classList.toggle('open'); const t=document.getElementById('txt-'+b.dataset.id); if(c.classList.contains('open')&&t)t.focus();} }));
  list.querySelectorAll('.rcompose .send').forEach(b=>b.addEventListener('click',async()=>{
    const id=b.dataset.id, t=document.getElementById('txt-'+id), m=document.getElementById('cmsg-'+id);
    const message=(t.value||'').trim(); if(!message){ m.className='cmsg err'; m.textContent='Write something first.'; return; }
    b.disabled=true; m.className='cmsg'; m.textContent='Sending…';
    try{ await api('reply',{id,message}); const rr=RESP.find(x=>x.id===id); if(rr){rr.read=true;rr.replied=true;rr.reply=message;rr.thread=(rr.thread||[]).concat([{f:'m',t:message,at:new Date().toISOString()}]);} render(); }
    catch(e){ b.disabled=false; m.className='cmsg err'; m.textContent=e.message; }
  }));
  list.querySelectorAll('.markbtn').forEach(b=>b.addEventListener('click',async()=>{
    const read=b.dataset.read==='true';
    try{ await api('markRead',{id:b.dataset.id,read}); const rr=RESP.find(x=>x.id===b.dataset.id); if(rr)rr.read=read; render(); }catch(e){ alert(e.message); }
  }));
}
(async()=>{ if(await guard()) load(); })();
</script>
<script>
// "View site" should mean YOUR site — the bare root is Co·labr's front page now.
fetch('/.netlify/functions/me?full=1').then(r=>r.ok?r.json():null).then(me=>{
  if(me&&me.miss&&me.miss.name){document.querySelectorAll('a[href="index.html"]').forEach(a=>a.href='index.html?m='+encodeURIComponent(me.miss.name));}
});
</script>
<script src="help.js"></script>
</body>
</html>
