<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoLabr — Dashboard</title>
<style>
  :root{--acc:#FF6600;--bg:#f4f1ec;--card:#ffffff;--card2:#f4f1ec;--line:#e7e4e0;--muted:#7a756f;--text:#241f1b;--green:#2f9e63;--amber:#b8791b;--red:#c0392b;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  svg{display:block}
  .wrap{max-width:940px;margin:0 auto;padding:0 18px 80px}
  .top{display:flex;align-items:center;gap:12px;padding:18px 2px 14px;border-bottom:1px solid var(--line);margin-bottom:22px}
  .brand .jvlogo{height:20px;width:auto;display:block;margin-bottom:5px}
  .brand .pg{font-size:11px;color:var(--muted);display:block;margin-top:4px}
  .nav{margin-left:auto;display:flex;gap:8px;align-items:center}
  .nav a{font-size:12.5px;color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:7px 12px;border-radius:8px}
  .nav a.acc{background:var(--acc);color:#fff;border-color:var(--acc)}
  .who{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}.who img{width:26px;height:26px;border-radius:50%}
  h1{font-size:24px;font-weight:750;letter-spacing:-.02em;margin:4px 0 18px}

  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
  @media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
  .kpi b{font-size:26px;font-weight:780;display:block;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .kpi span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .kpi.acc b{color:var(--acc)}

  .insights{margin-bottom:14px}
  .insights h2{display:flex;align-items:center;gap:8px}
  .insights .aib{font-size:9px;font-weight:800;letter-spacing:.05em;background:#241a10;color:var(--acc);padding:2px 6px;border-radius:6px}
  .insights h2 a{margin-left:auto;font-size:11px;font-weight:650;color:var(--acc);cursor:pointer;text-decoration:none;text-transform:none;letter-spacing:0}
  .ins{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.5}
  .ins:last-child{border:none}
  .ins svg{width:15px;height:15px;fill:var(--acc);stroke:none;flex:none;margin-top:2px}
  .panels{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:22px}
  @media(max-width:720px){.panels{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
  .panel h2{font-size:13px;font-weight:750;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 14px}
  .chart{width:100%;overflow-x:auto}
  .chart svg{min-width:100%}
  .bar{fill:var(--acc)}
  .barbg{fill:#efe9e0}
  .axis{font-size:10px;fill:var(--muted)}
  .barval{font-size:9.5px;fill:var(--muted);font-weight:600}
  .barcount{font-size:12px;fill:#fff;font-weight:800}
  .barcountd{font-size:12px;fill:var(--text);font-weight:800}
  .chartkey{font-size:10.5px;color:var(--muted);margin-top:8px;text-align:center}
  .tl .trow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .tl .trow:last-child{border:none}
  .tl .trow .rank{width:20px;color:var(--muted);font-weight:700;flex:none}
  .tl .trow .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .tl .trow .op{color:var(--acc);font-weight:750;font-variant-numeric:tabular-nums;flex:none}

  .listhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .listhead h2{font-size:16px;font-weight:750;margin:0}
  .seg{margin-left:auto;display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  .seg button{border:none;background:none;font-size:12.5px;font-weight:650;padding:8px 13px;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--acc);color:#fff}
  .item{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin-bottom:9px}
  .st{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:4px 8px;border-radius:11px;flex:none}
  .st.Published{background:#eafaf1;color:#1f7a48}.st.Draft{background:#fdf2e0;color:#a9701a}.st.Scheduled{background:#eaf3fb;color:#2f6df0}
  .item .tt{flex:1;min-width:0}
  .item .tt b{font-size:14.5px;font-weight:650;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .tt span{font-size:11.5px;color:var(--muted)}
  .act{display:flex;gap:7px;flex:none}
  .act button,.act a.edit{font-size:12px;font-weight:650;padding:8px 11px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--text);cursor:pointer;text-decoration:none;display:inline-block}
  .act a.edit{color:var(--acc);border-color:#f3d3b6}
  .act .pub{border-color:#bfe6cf;color:var(--green)}.act .unpub{color:var(--amber)}.act .del{color:var(--red)}
  .state{color:var(--muted);padding:34px 4px;font-size:14px}
  .appearance h2 .hint{font-size:11px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0;margin-left:8px}
  .styles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media(max-width:720px){.styles{grid-template-columns:repeat(2,1fr)}}
  .scard{border:2px solid var(--line);border-radius:12px;padding:11px;cursor:pointer;background:var(--card2);transition:.14s;position:relative}
  .scard:hover{border-color:#f3d3b6}
  .scard.on{border-color:var(--acc);background:#fff;box-shadow:0 6px 18px rgba(255,102,0,.12)}
  .scard .thumb{height:64px;border-radius:8px;margin-bottom:9px;overflow:hidden;border:1px solid var(--line);background:#f4f1ec}
  .scard .thumb svg{width:100%;height:100%;display:block}
  .scard .nm{font-size:13.5px;font-weight:750;display:flex;align-items:center;gap:6px}
  .scard .nm .ck{color:var(--acc)}
  .scard .ds{font-size:11px;color:var(--muted);line-height:1.35;margin-top:3px;min-height:29px}
  .scard .prev{display:inline-block;margin-top:8px;font-size:11.5px;font-weight:700;color:var(--acc)}
  .scard .cur{position:absolute;top:9px;right:9px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#fff;background:var(--acc);padding:3px 7px;border-radius:20px;display:none}
  .scard.on .cur{display:block}
  .savenote{font-size:11.5px;color:var(--muted);margin-top:10px;min-height:15px}
  .savenote.err{color:var(--red)}.savenote.ok{color:var(--green)}
  .ib{display:inline-block;background:var(--acc);color:#fff;font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px;margin-left:6px}
  .ib.zero{background:#d9d3c7;color:#fff}
  .inbox .ritem{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;background:var(--card)}
  .inbox .ritem.unread{border-color:#f3d3b6;background:#fff8f1}
  .rtype{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:4px 8px;border-radius:11px;flex:none}
  .rtype.Prayer{background:#eef3fe;color:#2f6df0}.rtype.Note{background:#fdf2e0;color:#a9701a}.rtype.Encouragement{background:#eafaf1;color:#1f7a48}
  .rtx{flex:1;min-width:0}.rtx b{font-size:14px}.rtx .rm{font-size:13px;color:#463a28;margin-top:2px;line-height:1.45}
  .rtx .rmeta{font-size:11.5px;color:var(--muted);margin-top:4px}
  .ract{display:flex;flex-direction:column;gap:6px;flex:none}
  .ract a,.ract button{font-size:11.5px;font-weight:650;padding:6px 10px;border-radius:7px;border:1px solid var(--line);background:var(--card2);cursor:pointer;text-decoration:none;color:var(--text);text-align:center}
  .ract .reply{color:var(--acc);border-color:#f3d3b6}
</style>
</head>

<script>
let ROWS=[], statusF='all';
async function guard(){
  try{ const r=await fetch('/.netlify/functions/me'); if(!r.ok) throw 0; const me=await r.json();
    document.getElementById('who').innerHTML=(me.pic?`<img src="${me.pic}" alt="">`:'')+`<span>${me.email}</span>`; return true;
  }catch{ location.replace('login.html'); return false; }
}
async function api(action,extra){
  const r=await fetch('/.netlify/functions/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...extra})});
  if(r.status===401){location.replace('login.html');throw new Error('Please sign in.');}
  const d=await r.json(); if(!r.ok) throw new Error(d.error||'Error'); return d;
}
async function load(){ try{ ROWS=(await api('list')).rows; renderAll(); loadInsights(); } catch(e){ document.getElementById('list').innerHTML='<div class="state">'+e.message+'</div>'; } }
async function loadInsights(){
  const box=document.getElementById('insights');
  const rows=ROWS.map(r=>({t:r.title,y:(r.date||'').slice(0,4),o:r.opens||0,type:r.type,status:r.status}));
  if(rows.length<2){ box.innerHTML='<div class="state" style="padding:10px 0">Publish a few updates and insights will appear here.</div>'; return; }
  box.innerHTML='<div class="state" style="padding:10px 0">Reading your updates…</div>';
  try{
    const r=await fetch('/.netlify/functions/insights',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rows})});
    if(r.status===401){location.replace('login.html');return;}
    const d=await r.json(); if(!r.ok) throw new Error(d.error||'Could not generate insights.');
    box.innerHTML=d.insights.map(t=>`<div class="ins"><svg viewBox="0 0 24 24"><path d="M12 3l1.9 4.6L18.5 9l-4.6 1.9L12 15.5 10.1 10.9 5.5 9l4.6-1.4z"/></svg><span>${esc(t)}</span></div>`).join('');
  }catch(e){ box.innerHTML='<div class="state" style="padding:10px 0">'+e.message+'</div>'; }
}
document.getElementById('refreshins').addEventListener('click',loadInsights);
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function renderAll(){
  const pub=ROWS.filter(r=>r.status==='Published').length;
  const dr=ROWS.filter(r=>r.status==='Draft').length;
  const opens=ROWS.reduce((s,r)=>s+(r.opens||0),0);
  const withOpens=ROWS.filter(r=>r.opens>0);
  const avg=withOpens.length?Math.round(opens/withOpens.length):0;
  document.getElementById('kpis').innerHTML=
    kpi(ROWS.length,'Updates')+kpi(pub,'Published')+kpi(dr,'Drafts')+kpi(opens.toLocaleString(),'Total opens',true)+kpi(avg.toLocaleString(),'Avg / update');
  renderChart(); renderTop(); renderList();
}
function kpi(v,l,acc){ return `<div class="kpi${acc?' acc':''}"><b>${v}</b><span>${l}</span></div>`; }

function renderChart(){
  const byOpen={}, byCount={};
  ROWS.forEach(r=>{const y=(r.date||'').slice(0,4); if(y){byOpen[y]=(byOpen[y]||0)+(r.opens||0); byCount[y]=(byCount[y]||0)+1;}});
  const years=Object.keys(byCount).sort();
  const el=document.getElementById('chart');
  if(!years.length){ el.innerHTML='<div class="state" style="padding:12px 0">No dated updates yet.</div>'; return; }
  const max=Math.max(1,...years.map(y=>byOpen[y]||0));
  const gap=10, bw=30, W=years.length*(bw+gap)+10, H=184, base=H-24, top=16;
  let bars='';
  years.forEach((y,i)=>{
    const x=10+i*(bw+gap);
    const h=Math.round(((byOpen[y]||0)/max)*(base-top));
    const cnt=byCount[y];
    bars+=`<rect class="barbg" x="${x}" y="${top}" width="${bw}" height="${base-top}" rx="4"/>`;
    bars+=`<rect class="bar" x="${x}" y="${base-h}" width="${bw}" height="${h}" rx="4"/>`;
    if((byOpen[y]||0)>0) bars+=`<text class="barval" x="${x+bw/2}" y="${base-h-4}" text-anchor="middle">${byOpen[y]>=1000?(byOpen[y]/1000).toFixed(1)+'k':byOpen[y]}</text>`;
    if(h>=20) bars+=`<text class="barcount" x="${x+bw/2}" y="${base-7}" text-anchor="middle">${cnt}</text>`;
    else bars+=`<text class="barcountd" x="${x+bw/2}" y="${base-h-14}" text-anchor="middle">${cnt}</text>`;
    bars+=`<text class="axis" x="${x+bw/2}" y="${H-6}" text-anchor="middle">'${y.slice(2)}</text>`;
  });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMid meet" height="${H}">${bars}</svg>`
    +`<div class="chartkey">Bar height = opens · number = updates sent that year</div>`;
}
function renderTop(){
  const top=[...ROWS].filter(r=>r.opens>0).sort((a,b)=>b.opens-a.opens).slice(0,5);
  const el=document.getElementById('topu');
  if(!top.length){ el.innerHTML='<div class="state" style="padding:12px 0">No open data yet.</div>'; return; }
  el.innerHTML=top.map((r,i)=>`<div class="trow"><span class="rank">${i+1}</span><a class="tt" href="compose.html?id=${r.id}" style="color:inherit;text-decoration:none">${esc(r.title)}</a><span class="op">${r.opens.toLocaleString()}</span></div>`).join('');
}
function renderList(){
  const rows=statusF==='all'?ROWS:ROWS.filter(r=>r.status===statusF);
  const list=document.getElementById('list');
  if(!rows.length){ list.innerHTML='<div class="state">No updates here.</div>'; return; }
  list.innerHTML=rows.map(r=>{
    const toggle=r.status==='Published'?`<button class="unpub" data-act="unpub" data-id="${r.id}">Unpublish</button>`:`<button class="pub" data-act="pub" data-id="${r.id}">Publish</button>`;
    const tags=[r.type,(r.aud||[]).join(' + ')].filter(Boolean).join(' · ');
    return `<div class="item"><span class="st ${r.status}">${r.status}</span>
      <div class="tt"><b>${esc(r.title)}</b><span>${r.date||'—'} · ${tags}${r.opens?(' · '+r.opens.toLocaleString()+' opens'):''}</span></div>
      <div class="act"><a class="edit" href="compose.html?id=${r.id}">Edit</a>${toggle}<button class="del" data-act="del" data-id="${r.id}">Delete</button></div></div>`;
  }).join('');
  list.querySelectorAll('button[data-act]').forEach(btn=>btn.addEventListener('click',()=>act(btn.dataset.act,btn.dataset.id)));
}
document.getElementById('statusfilter').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{statusF=b.dataset.s;document.getElementById('statusfilter').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));renderList();}));
async function act(a,id){
  try{
    if(a==='pub') await api('setStatus',{id,status:'Published'});
    else if(a==='unpub') await api('setStatus',{id,status:'Draft'});
    else if(a==='del'){ if(!confirm('Delete this update permanently?'))return; await api('delete',{id}); }
    ROWS=(await api('list')).rows; renderAll();
  }catch(e){ alert(e.message); }
}
/* ---- Supporter page style picker ---- */
const THUMB={
  fieldnotes:`<svg viewBox="0 0 120 64"><rect width="120" height="64" fill="#efe7d4"/><g transform="rotate(-6 42 32)"><rect x="20" y="14" width="44" height="40" fill="#fff" stroke="#e0d6c0"/><rect x="24" y="18" width="36" height="24" fill="#e8a24b"/><rect x="34" y="10" width="18" height="7" fill="#ffd68f" opacity=".8"/></g><rect x="72" y="20" width="34" height="4" rx="2" fill="#b04a1f"/><rect x="72" y="30" width="40" height="3" rx="1.5" fill="#c9bfa8"/><rect x="72" y="37" width="40" height="3" rx="1.5" fill="#c9bfa8"/><rect x="72" y="44" width="26" height="3" rx="1.5" fill="#c9bfa8"/></svg>`,
  grid:`<svg viewBox="0 0 120 64"><rect width="120" height="64" fill="#f4f1ec"/><g fill="#fff" stroke="#e2ddd3"><rect x="8" y="8" width="32" height="22" rx="3"/><rect x="44" y="8" width="32" height="22" rx="3"/><rect x="80" y="8" width="32" height="22" rx="3"/><rect x="8" y="34" width="32" height="22" rx="3"/><rect x="44" y="34" width="32" height="22" rx="3"/><rect x="80" y="34" width="32" height="22" rx="3"/></g><g fill="#e8a24b"><rect x="10" y="10" width="28" height="12" rx="2"/><rect x="46" y="10" width="28" height="12" rx="2" fill="#5f8fb0"/><rect x="82" y="10" width="28" height="12" rx="2" fill="#5fae7d"/><rect x="10" y="36" width="28" height="12" rx="2" fill="#5fae7d"/><rect x="46" y="36" width="28" height="12" rx="2" fill="#e8a24b"/><rect x="82" y="36" width="28" height="12" rx="2" fill="#5f8fb0"/></g></svg>`,
  timeline:`<svg viewBox="0 0 120 64"><rect width="120" height="64" fill="#f4f1ec"/><rect x="17" y="8" width="2" height="48" fill="#e0d9cb"/><g><circle cx="18" cy="16" r="4" fill="#FF6600"/><circle cx="18" cy="34" r="4" fill="#FF6600"/><circle cx="18" cy="50" r="4" fill="#FF6600"/></g><g fill="#fff" stroke="#e2ddd3"><rect x="30" y="10" width="80" height="14" rx="3"/><rect x="30" y="28" width="80" height="14" rx="3"/><rect x="30" y="46" width="80" height="12" rx="3"/></g><g fill="#d8c4a0"><rect x="34" y="13" width="20" height="8" rx="2"/><rect x="34" y="31" width="20" height="8" rx="2"/></g></svg>`,
  wall:`<svg viewBox="0 0 120 64"><rect width="120" height="64" fill="#f4f1ec"/><g><rect x="8" y="8" width="32" height="30" rx="3" fill="#e8a24b"/><rect x="8" y="42" width="32" height="14" rx="3" fill="#5f8fb0"/><rect x="44" y="8" width="32" height="16" rx="3" fill="#5fae7d"/><rect x="44" y="28" width="32" height="28" rx="3" fill="#c99a3f"/><rect x="80" y="8" width="32" height="24" rx="3" fill="#5f8fb0"/><rect x="80" y="36" width="32" height="20" rx="3" fill="#5fae7d"/></g></svg>`
};
const STYLE_DEFS=[
  {name:'Field Notes',key:'fieldnotes',ds:'Handmade scrapbook — taped photos & typed letters'},
  {name:'Cover Grid',key:'grid',ds:'A clean gallery of cover cards'},
  {name:'Timeline',key:'timeline',ds:'A vertical journey, year by year'},
  {name:'Gallery Wall',key:'wall',ds:'A photo wall / mosaic of moments'}
];
let curStyle='Field Notes';
async function loadStyle(){
  try{ const d=await api('getStyle'); if(d.style) curStyle=d.style; }catch(e){}
  renderStyles();
}
function renderStyles(){
  document.getElementById('styles').innerHTML=STYLE_DEFS.map(s=>`
    <div class="scard ${s.name===curStyle?'on':''}" data-style="${s.name}">
      <span class="cur">Current</span>
      <div class="thumb">${THUMB[s.key]}</div>
      <div class="nm">${s.name}${s.name===curStyle?'<span class="ck">✓</span>':''}</div>
      <div class="ds">${s.ds}</div>
      <a class="prev" href="index.html?style=${s.key}" target="_blank" rel="noopener">Preview →</a>
    </div>`).join('');
  document.querySelectorAll('.scard').forEach(c=>c.addEventListener('click',e=>{
    if(e.target.closest('.prev')) return;
    pickStyle(c.dataset.style);
  }));
}
async function pickStyle(name){
  if(name===curStyle) return;
  const prev=curStyle; curStyle=name; renderStyles();
  const note=document.getElementById('savenote'); note.className='savenote'; note.textContent='Saving…';
  try{ await api('setStyle',{style:name}); note.className='savenote ok'; note.textContent='Saved — your supporter page now uses “'+name+'.” Refresh it to see the change.'; }
  catch(e){ curStyle=prev; renderStyles(); note.className='savenote err'; note.textContent='Could not save: '+e.message; }
}
/* ---- Responses inbox ---- */
let RESP=[];
async function loadResponses(){
  const box=document.getElementById('inbox');
  try{ RESP=(await api('responses')).rows||[]; renderResponses(); }
  catch(e){ box.innerHTML='<div class="state" style="padding:10px 0">'+esc(e.message)+'</div>'; }
}
function renderResponses(){
  const unread=RESP.filter(r=>!r.read).length;
  const ub=document.getElementById('unread'); ub.textContent=unread?(unread+' new'):'0 new'; ub.classList.toggle('zero',!unread);
  const box=document.getElementById('inbox');
  if(!RESP.length){ box.innerHTML='<div class="state" style="padding:10px 0">No responses yet. When a supporter prays or writes, it lands here.</div>'; return; }
  box.innerHTML=RESP.map(r=>{
    let when=''; try{ when=r.created?new Date(r.created).toLocaleDateString():''; }catch(e){}
    const reply = r.email ? `<a class="reply" href="mailto:${esc(r.email)}?subject=${encodeURIComponent('Re: your message')}">Reply</a>` : '';
    const mark = r.read ? '' : `<button class="markbtn" data-id="${r.id}">Mark read</button>`;
    const msg = (r.type==='Prayer' && !r.message) ? '<i>is praying for you</i>' : esc(r.message);
    return `<div class="ritem ${r.read?'':'unread'}"><span class="rtype ${r.type}">${r.type}</span>
      <div class="rtx"><b>${esc(r.name)}</b><div class="rm">${msg}</div>
        <div class="rmeta">${r.updateTitle?esc(r.updateTitle)+' · ':''}${when}${r.isPublic?' · public':''}${r.email?(' · '+esc(r.email)):''}</div></div>
      <div class="ract">${reply}${mark}</div></div>`;
  }).join('');
  box.querySelectorAll('.markbtn').forEach(b=>b.addEventListener('click',async()=>{
    try{ await api('markRead',{id:b.dataset.id,read:true}); const rr=RESP.find(x=>x.id===b.dataset.id); if(rr)rr.read=true; renderResponses(); }catch(e){ alert(e.message); }
  }));
}
document.getElementById('refreshresp').addEventListener('click',loadResponses);
(async()=>{ if(await guard()){ load(); loadStyle(); loadResponses(); } })();
</script>
</body>
</html>
